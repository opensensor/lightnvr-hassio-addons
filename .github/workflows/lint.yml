name: Lint

# Validates the add-on against the community add-on linter (the de-facto
# standard checker used by Home Assistant add-on authors).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  container-smoke:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell scripts
        run: shellcheck lightnvr/*.sh

      - name: Build add-on
        run: docker build -t lightnvr-addon:issue688 lightnvr

      - name: Test fresh install and root-owned upgrade
        run: python3 tests/test_container.py

  addon-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./lightnvr"
